<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Donutmap – Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="brand"><img src="logo.svg" alt="" class="logo" onerror="this.remove()">
            <h1 id="name">Donutmap</h1><span>· Admin</span>
        </div>
        <nav><a href="index.html">Shop</a><button id="theme" class="btn btn-icon"
                aria-label="Toggle dark mode">🌓</button></nav>
    </header>
    <main class="wrap">
        <section class="card">
            <h2>Read product code</h2><textarea id="in" placeholder="Paste product code (DM1-…)"></textarea>
            <div class="actions"><button id="go" class="btn btn-primary">Decode &amp; verify</button><button id="clr"
                    class="btn btn-ghost">Clear</button></div>
        </section>
        <div id="res"></div>
    </main>
    <script src="common.js"></script>
    <script src="pricing.js"></script>
    <script src="codec.js"></script>
    <script src="admin.js"></script>
</body>

</html>
